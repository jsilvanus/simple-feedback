version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: simple_feedback_db
    environment:
      POSTGRES_DB: simple_feedback
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data_feedback:/var/lib/postgresql/data

volumes:
  db_data_feedback:
